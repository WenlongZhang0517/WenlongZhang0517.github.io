<style>
  .featured-publications-grid {
    --fp-radius: 1.35rem;
    max-width: 1240px !important;
  }

  .featured-publication-card {
    --fp-accent: 99 102 241;
    --fp-accent-2: 99 102 241;
    position: relative;
    isolation: isolate;
    display: grid;
    grid-template-columns: minmax(15rem, 29%) minmax(0, 1fr);
    min-height: 16rem;
    overflow: hidden;
    border: 1px solid rgb(var(--fp-accent) / 0.2);
    border-radius: var(--fp-radius);
    background:
      radial-gradient(circle at 92% 8%, rgb(var(--fp-accent-2) / 0.12), transparent 26rem),
      linear-gradient(135deg, rgb(255 255 255 / 0.98), rgb(var(--fp-accent) / 0.035));
    box-shadow:
      0 1px 2px rgb(15 23 42 / 0.04),
      0 18px 45px -28px rgb(var(--fp-accent) / 0.55);
    transition: transform 280ms ease, border-color 280ms ease, box-shadow 280ms ease;
  }

  .featured-publication-card::before {
    position: absolute;
    z-index: 3;
    top: 0;
    right: 0;
    left: 0;
    height: 3px;
    content: "";
    background: linear-gradient(90deg, rgb(var(--fp-accent)), rgb(var(--fp-accent-2)), transparent 92%);
  }

  .featured-publication-card:hover {
    transform: translateY(-5px);
    border-color: rgb(var(--fp-accent) / 0.42);
    box-shadow:
      0 6px 16px -8px rgb(15 23 42 / 0.12),
      0 30px 65px -32px rgb(var(--fp-accent) / 0.65);
  }

  .featured-publication-media {
    position: relative;
    min-width: 0;
    overflow: hidden;
    border-right: 1px solid rgb(var(--fp-accent) / 0.13);
    background:
      radial-gradient(circle at 18% 15%, rgb(var(--fp-accent-2) / 0.22), transparent 13rem),
      radial-gradient(circle at 90% 92%, rgb(var(--fp-accent) / 0.2), transparent 12rem),
      linear-gradient(145deg, rgb(var(--fp-accent) / 0.1), rgb(248 250 252 / 0.92));
  }

  .featured-publication-media::after {
    position: absolute;
    inset: 0;
    content: "";
    pointer-events: none;
    opacity: 0.42;
    background-image: radial-gradient(rgb(var(--fp-accent) / 0.3) 0.8px, transparent 0.8px);
    background-size: 15px 15px;
    mask-image: linear-gradient(135deg, black, transparent 72%);
  }

  .featured-publication-image-frame {
    position: absolute;
    z-index: 1;
    inset: 0.95rem;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    border: 1px solid rgb(255 255 255 / 0.82);
    border-radius: calc(var(--fp-radius) - 0.45rem);
    background: rgb(255 255 255 / 0.9);
    box-shadow: 0 18px 38px -22px rgb(15 23 42 / 0.55);
    backdrop-filter: blur(12px);
  }

  .featured-publication-image-frame img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    transition: transform 420ms cubic-bezier(0.22, 1, 0.36, 1);
  }

  .featured-publication-card:hover .featured-publication-image-frame img {
    transform: scale(1.035);
  }

  .featured-publication-placeholder {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0.55rem;
    color: rgb(var(--fp-accent));
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }

  .featured-publication-placeholder span:first-child {
    font-size: 2.25rem;
  }

  .featured-publication-venue,
  .featured-publication-year {
    position: absolute;
    z-index: 2;
    display: inline-flex;
    align-items: center;
    border: 1px solid rgb(255 255 255 / 0.65);
    border-radius: 999px;
    box-shadow: 0 8px 20px -12px rgb(15 23 42 / 0.75);
    backdrop-filter: blur(12px);
  }

  .featured-publication-venue {
    top: 1.55rem;
    left: 1.55rem;
    max-width: calc(100% - 3.1rem);
    padding: 0.36rem 0.72rem;
    overflow: hidden;
    color: white;
    background: linear-gradient(120deg, rgb(var(--fp-accent) / 0.96), rgb(var(--fp-accent-2) / 0.92));
    font-size: 0.72rem;
    font-weight: 750;
    letter-spacing: 0.045em;
    line-height: 1;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .featured-publication-venue p {
    margin: 0;
  }

  .featured-publication-year {
    right: 1.55rem;
    bottom: 1.55rem;
    padding: 0.34rem 0.65rem;
    color: rgb(30 41 59);
    background: rgb(255 255 255 / 0.86);
    font-size: 0.72rem;
    font-weight: 800;
    letter-spacing: 0.09em;
  }

  .featured-publication-content {
    position: relative;
    z-index: 1;
    display: flex;
    min-width: 0;
    flex-direction: column;
    justify-content: center;
    gap: 0.72rem;
    padding: 1.5rem 1.75rem 1.6rem;
  }

  .featured-publication-kicker {
    display: flex;
    align-items: center;
    justify-content: space-between;
    color: rgb(var(--fp-accent));
    font-size: 0.68rem;
    font-weight: 800;
    letter-spacing: 0.14em;
    text-transform: uppercase;
  }

  .featured-publication-number {
    color: rgb(var(--fp-accent) / 0.16);
    font-size: 2rem;
    font-weight: 900;
    letter-spacing: -0.08em;
    line-height: 0.8;
  }

  .featured-publication-title {
    margin: 0;
    max-width: 58rem;
    color: rgb(15 23 42);
    font-size: clamp(1.02rem, 1.25vw, 1.3rem);
    font-weight: 800;
    letter-spacing: -0.025em;
    line-height: 1.25;
  }

  .featured-publication-title a {
    color: inherit;
    text-decoration: none;
    transition: color 180ms ease;
  }

  .featured-publication-title a:hover {
    color: rgb(var(--fp-accent));
  }

  .featured-publication-authors {
    display: -webkit-box;
    max-width: 64rem;
    overflow: hidden;
    color: rgb(100 116 139);
    font-size: 0.75rem;
    line-height: 1.62;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 2;
  }

  .featured-publication-abstract {
    display: -webkit-box;
    margin: 0;
    max-width: 58rem;
    overflow: hidden;
    color: rgb(71 85 105);
    font-size: 0.82rem;
    line-height: 1.65;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 2;
  }

  .featured-publication-actions {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.55rem;
    padding-top: 0.25rem;
  }

  #papers .featured-publication-actions .hb-attachment-link,
  .featured-publication-details {
    display: inline-flex;
    min-height: 2.1rem;
    align-items: center;
    justify-content: center;
    gap: 0.38rem;
    margin: 0;
    padding: 0.42rem 0.72rem;
    border: 1px solid rgb(var(--fp-accent) / 0.2);
    border-radius: 999px;
    color: rgb(var(--fp-accent));
    background: rgb(var(--fp-accent) / 0.065);
    font-size: 0.72rem;
    font-weight: 750;
    line-height: 1;
    text-decoration: none;
    transition: color 180ms ease, background-color 180ms ease, border-color 180ms ease, transform 180ms ease;
  }

  #papers .featured-publication-actions .hb-attachment-link:hover {
    transform: translateY(-1px);
    border-color: rgb(var(--fp-accent) / 0.4);
    background: rgb(var(--fp-accent) / 0.13);
  }

  .featured-publication-details {
    border-color: transparent;
    color: white;
    background: linear-gradient(120deg, rgb(var(--fp-accent)), rgb(var(--fp-accent-2)));
    box-shadow: 0 8px 18px -12px rgb(var(--fp-accent) / 0.8);
  }

  .featured-publication-details:hover {
    transform: translateY(-1px);
    color: white;
    box-shadow: 0 10px 24px -12px rgb(var(--fp-accent) / 0.9);
  }

  .dark .featured-publication-card {
    border-color: rgb(var(--fp-accent) / 0.27);
    background:
      radial-gradient(circle at 92% 8%, rgb(var(--fp-accent-2) / 0.14), transparent 26rem),
      linear-gradient(135deg, rgb(9 14 28 / 0.96), rgb(var(--fp-accent) / 0.08));
    box-shadow: 0 22px 54px -34px rgb(var(--fp-accent) / 0.72);
  }

  .dark .featured-publication-media {
    border-color: rgb(var(--fp-accent) / 0.22);
    background:
      radial-gradient(circle at 18% 15%, rgb(var(--fp-accent-2) / 0.28), transparent 13rem),
      linear-gradient(145deg, rgb(var(--fp-accent) / 0.18), rgb(15 23 42 / 0.9));
  }

  .dark .featured-publication-image-frame {
    border-color: rgb(255 255 255 / 0.13);
    background: rgb(15 23 42 / 0.82);
  }

  .dark .featured-publication-year {
    border-color: rgb(255 255 255 / 0.12);
    color: rgb(226 232 240);
    background: rgb(15 23 42 / 0.82);
  }

  .dark .featured-publication-title {
    color: rgb(248 250 252);
  }

  .dark .featured-publication-authors {
    color: rgb(148 163 184);
  }

  .dark .featured-publication-abstract {
    color: rgb(203 213 225);
  }

  @media (max-width: 767px) {
    .featured-publication-card {
      grid-template-columns: minmax(0, 1fr);
    }

    .featured-publication-media {
      min-height: 13rem;
      border-right: 0;
      border-bottom: 1px solid rgb(var(--fp-accent) / 0.13);
    }

    .featured-publication-content {
      padding: 1.35rem 1.2rem 1.5rem;
    }

    .featured-publication-number {
      font-size: 1.75rem;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .featured-publication-card,
    .featured-publication-image-frame img,
    #papers .featured-publication-actions .hb-attachment-link,
    .featured-publication-details {
      transition: none;
    }

    .featured-publication-card:hover,
    .featured-publication-card:hover .featured-publication-image-frame img {
      transform: none;
    }
  }
</style>
