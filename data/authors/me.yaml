bio: |
  I am a Young Researcher of Shanghai AI Laboratory, working with Prof. [Bo Zhang](https://bobrown.github.io/boZhang.github.io/), Prof. [Wanli Ouyang](https://wlouyang.github.io/) and Prof. [Lei Bai](http://leibai.site/). Before that, I got the PhD degree from Hong Kong Polytechnic University, working with Prof. [Xiao-Ming Wu](http://www4.comp.polyu.edu.hk/~csxmwu/). I also interned at [XPixel group](http://xpixel.group/) in Shanghai AI Laboratory and SIAT-CAS, working with Prof. [Chao Dong](https://scholar.google.com/citations?hl=zh-CN&user=OSDCB0UAAAAJ) and Prof. [Yu Qiao](http://mmlab.siat.ac.cn/team). In 2018, I got the Master degree from the Beijing Institute of Technology, supervised by Prof. [Weidong Hu](https://ice.bit.edu.cn/szdw/jsfc/895feca632d747dc81769fbaf7be5ef5.htm).

  Currently, I lead a team engaged in Agent model Alignment, Post-training and Evaluation. Recently, my primary areas of focus include:

  - **Long-horizon agent evaluation:** How do we formulate the workflow of scientific and real-world scenarios with agent models into a unified benchmark?
  - **Agent model alignment:** How can we align agent models with human preferences, scientific objectives, and domain constraints while ensuring reliability, generalization, and controllability?
  - **Agent model post-training:** How can we develop scalable data and optimization strategies to improve the planning, reasoning, tool use, and long-horizon decision-making capabilities of agent models?
